spring.application.name=ms-categoria
server.port=8087
spring.config.import=optional:configserver:http://localhost:8888

spring.datasource.url=jdbc:mysql://localhost:3306/db_categoria?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.com.bodeguita.ms_producto.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true